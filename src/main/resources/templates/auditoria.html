<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-shield-check me-2 text-primary"></i>Auditoria
        </h2>
        <select id="filtro" class="form-select w-auto">
            <option value="">Todas as entidades</option>
            <option value="Pedido">Pedido</option>
            <option value="Cliente">Cliente</option>
            <option value="Usuario">Usuário</option>
        </select>
    </div>

    <div id="erro" class="alert alert-danger" style="display:none"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Data/hora</th>
                        <th>Usuário</th>
                        <th>Operação</th>
                        <th>Entidade</th>
                        <th>Campo</th>
                        <th>Valor anterior</th>
                        <th>Novo valor</th>
                        <th>Justificativa</th>
                    </tr>
                </thead>
                <tbody id="auditoria-tabela"></tbody>
            </table>
        </div>
        <div class="card-footer text-muted small">Exibindo os 500 eventos mais recentes. Registros somente leitura.</div>
    </div>

    <script>
        (function () {
            const tabela = document.getElementById('auditoria-tabela');
            const filtro = document.getElementById('filtro');
            let eventos = [];

            const esc = s => String(s ?? '').replace(/[&<>"']/g,
                c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

            function render() {
                const linhas = [];
                eventos.filter(e => !filtro.value || e.entidade === filtro.value).forEach(e => {
                    (e.alteracoes || []).forEach((a, i) => {
                        linhas.push(`<tr>
                            <td class="ps-4">${i === 0 ? new Date(e.dataHora).toLocaleString('pt-BR') : ''}</td>
                            <td>${i === 0 ? esc(e.usuario) + ' <span class="badge bg-secondary">' + esc(e.perfil) + '</span>' : ''}</td>
                            <td>${i === 0 ? esc(e.operacao) : ''}</td>
                            <td>${i === 0 ? esc(e.entidade) + '<br><small class="text-muted">' + esc(e.entidadeId) + '</small>' : ''}</td>
                            <td>${esc(a.campo)}</td>
                            <td>${esc(a.valorAnterior ?? '—')}</td>
                            <td>${esc(a.valorNovo ?? '—')}</td>
                            <td>${i === 0 ? esc(e.justificativa ?? '') : ''}</td></tr>`);
                    });
                });
                tabela.innerHTML = linhas.join('') ||
                    '<tr><td colspan="8" class="text-center text-muted py-5">Nenhum registro.</td></tr>';
            }

            filtro.addEventListener('change', render);
            fetch('/api/auditoria').then(r => {
                if (!r.ok) throw new Error('Sem permissão para consultar a auditoria.');
                return r.json();
            }).then(dados => { eventos = dados; render(); })
              .catch(e => {
                  const el = document.getElementById('erro');
                  el.textContent = e.message;
                  el.style.display = '';
              });
        })();
    </script>
</div>

</body>
</html>
